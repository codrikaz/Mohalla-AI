name: mohalla
description: Hyperlocal community app for Indian colonies and villages
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Location
  geolocator: ^13.0.2

  # Crypto (SHA-256 for phone hash)
  crypto: ^3.0.6

  # UI
  cached_network_image: ^3.4.1
  timeago: ^3.7.0

  # Media
  image_picker: ^1.1.2

  # Firebase (FCM)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  # Storage
  shared_preferences: ^2.3.4

  # Country picker
  country_picker: ^2.0.26

  # Reverse geocoding (GPS → area naam)
  geocoding: ^3.0.0

  # Utils
  intl: ^0.20.1
  uuid: ^4.5.1
  permission_handler: ^11.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
